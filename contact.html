<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us - Daily Tech News</title>
</head>

<body>

    <header>

        <h1>Daily Tech News</h1>

        <nav>
            <a href="index.html">Home</a> |
            <a href="about.html">About Us</a> |
            <a href="contact.html">Contact Us</a>
        </nav>

    </header>

    <main>

        <h2>Contact Us</h2>

        <form>

            <label for="name">
                Name:
            </label>

            <br>

            <input
                type="text"
                id="name"
                name="name"
            >

            <br><br>

            <label for="mobile">
                Mobile Number:
            </label>

            <br>

            <input
                type="tel"
                id="mobile"
                name="mobile"
            >

            <br><br>

            <label for="communication">
                Type of Communication:
            </label>

            <br>

            <select
                id="communication"
                name="communication"
            >

                <option value="">
                    Select
                </option>

                <option value="sales">
                    Sales
                </option>

                <option value="service">
                    Service
                </option>

                <option value="enquiry">
                    Enquiry
                </option>

                <option value="advertisement">
                    Advertisement
                </option>

                <option value="complaint">
                    Complaint
                </option>

            </select>

            <br><br>

            <label for="description">
                Description:
            </label>

            <br>

            <textarea
                id="description"
                name="description"
                rows="6"
                cols="50">
            </textarea>

            <br><br>

            <button type="submit">
                Submit
            </button>

        </form>

    </main>

    <footer>

        <p>&copy; 2026 Daily Tech News</p>

    </footer>

</body>

</html>
