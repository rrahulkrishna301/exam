<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS 1</title>
<style>
  table {
    border-collapse: collapse;
    width: 100%;
    border: 2px solid black;
  }
  th, td {
    border: 1px solid black;
    padding: 10px;
    text-align: left;
    background-color: grey;
    color: white;
  }
</style>
</head>
<body>
    <h1><b>PRODUCT INFORMATION</b></h1>
  <table>
    <tr>
      <th>Id</th>
      <th>Product Name</th>
      <th>Product Price</th>
    </tr>
    <tr><td>1</td><td>Keyboard</td><td>2000 Rs</td></tr>
    <tr><td>2</td><td>Mouse</td><td>500 Rs</td></tr>
    <tr><td>3</td><td>Monitor</td><td>20,000 Rs</td></tr>
    <tr><td>4</td><td>Headphones</td><td>4500 Rs</td></tr>
    <tr><td>5</td><td>TWS Buds</td><td>4000 Rs</td></tr>
  </table>
</body>
</html>
